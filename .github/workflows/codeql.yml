name: CodeQL
on:
  push:
    branches: [main, 'feat/**']
  pull_request:
    branches: [main]
permissions:
  contents: read
jobs:
  analyze:
    name: CodeQL
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    permissions:
      contents: read
      security-events: write
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - uses: github/codeql-action/init@cf12ceefebab2c867b9c35d7f907e059681d37ab # v3
        with:
          languages: javascript-typescript
          build-mode: none
      - uses: github/codeql-action/analyze@cf12ceefebab2c867b9c35d7f907e059681d37ab # v3
